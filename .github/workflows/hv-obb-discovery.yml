name: HV OBB Discovery

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'RESEARCH/CSR2/HV_EXTRACTION_6.7.0/**'
      - '.github/workflows/hv-obb-discovery.yml'

permissions:
  contents: read

env:
  MAIN_OBB: RESEARCH/CSR2/GAME_VERSIONS/6.7.0/MAIN_OBB/main.6705213.com.naturalmotion.customstreetracer2.obb
  PATCH_OBB: RESEARCH/CSR2/GAME_VERSIONS/6.7.0/PATCH_OBB/patch.6705213.com.naturalmotion.customstreetracer2.obb

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          lfs: false
          fetch-depth: 1

      - name: Pull canonical CSR2 6.7.0 OBBs
        run: |
          git lfs version
          git lfs install --local
          git lfs pull --include="$MAIN_OBB,$PATCH_OBB"
          ls -lh "$MAIN_OBB" "$PATCH_OBB"
          sha256sum "$MAIN_OBB" "$PATCH_OBB"

      - name: Install UnityPy
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install UnityPy
          python3 - <<'PY'
          import UnityPy
          print('UnityPy version:', UnityPy.__version__)
          PY

      - name: Diagnose raw OBB structure
        continue-on-error: true
        run: |
          mkdir -p hv-output/diagnostic
          python3 RESEARCH/CSR2/HV_EXTRACTION_6.7.0/diagnose_obb_structure.py \
            --obb "$MAIN_OBB" \
            --obb "$PATCH_OBB" \
            --out hv-output/diagnostic/obb_structure_diagnostic.json
          test -f hv-output/diagnostic/obb_structure_diagnostic.json

      - name: Discover HV-001 in OBBs
        continue-on-error: true
        run: |
          mkdir -p hv-output/discovery
          python3 RESEARCH/CSR2/HV_EXTRACTION_6.7.0/scan_hero_vehicle.py \
            --obb "$MAIN_OBB" \
            --obb "$PATCH_OBB" \
            --out hv-output/discovery
          test -f hv-output/discovery/hero_vehicle_discovery.json

      - name: Upload discovery report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: csr2-6.7.0-hv-001-discovery
          path: hv-output/
          if-no-files-found: error
          retention-days: 14
