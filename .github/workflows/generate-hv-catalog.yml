name: Generate Hero Vehicle Catalog

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out KOSD
        uses: actions/checkout@v6

      - name: Generate Nitro-ordered catalog
        run: python3 RESEARCH/HERO_VEHICLES/nitro_hv_catalog.py

      - name: Commit catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RESEARCH/HERO_VEHICLES/HERO_VEHICLE_CATALOG.md
          if git diff --cached --quiet; then
            echo "Catalog is already current."
          else
            git commit -m "Generate Nitro-ordered Hero Vehicle catalog"
            git push
          fi
