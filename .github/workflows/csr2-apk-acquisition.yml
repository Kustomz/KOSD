name: CSR2 APK Acquisition

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_version:
        description: 'CSR2 version being acquired (for example 6.6.0 or 6.7.0)'
        required: true
        default: '6.7.0'
      chunk_glob:
        description: 'Optional chunk glob relative to ACQUISITION; leave blank for automatic discovery'
        required: false
        default: ''
      expected_package:
        description: 'Expected Android package name'
        required: false
        default: 'com.naturalmotion.customstreetracer2'

permissions:
  contents: read

concurrency:
  group: csr2-apk-acquisition-${{ inputs.target_version || '6.7.0' }}
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      TARGET_VERSION: ${{ inputs.target_version || '6.7.0' }}
      CHUNK_GLOB: ${{ inputs.chunk_glob }}
      EXPECTED_PACKAGE: ${{ inputs.expected_package || 'com.naturalmotion.customstreetracer2' }}

    steps:
      - name: Check out KOSD
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Discover and validate APK acquisition chunks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work output

          echo '=== Acquisition inventory ==='
          find ACQUISITION -maxdepth 1 -type f -name '*.zip.[0-9][0-9][0-9]' -printf '%f %s bytes\n' | sort -V || true

          if [[ -n "${CHUNK_GLOB}" ]]; then
            mapfile -t chunks < <(find ACQUISITION -maxdepth 1 -type f -path "ACQUISITION/${CHUNK_GLOB}" -printf '%f\n' | sort -V)
          else
            token="${TARGET_VERSION//./}"
            token="${token:0:3}"
            mapfile -t chunks < <(find ACQUISITION -maxdepth 1 -type f -name "base[[]${token}[]].zip.[0-9][0-9][0-9]" -printf '%f\n' | sort -V)

            if (( ${#chunks[@]} == 0 )) && [[ "${TARGET_VERSION}" == "6.6.0" ]]; then
              mapfile -t chunks < <(find ACQUISITION -maxdepth 1 -type f -name 'base.zip.[0-9][0-9][0-9]' -printf '%f\n' | sort -V)
            fi
          fi

          (( ${#chunks[@]} > 0 )) || { echo 'ERROR: No APK acquisition chunks found.' >&2; exit 1; }

          echo "=== Selected ${TARGET_VERSION} chunks ==="
          printf '%s\n' "${chunks[@]}"

          expected=1
          for chunk in "${chunks[@]}"; do
            suffix="${chunk##*.}"
            number=$((10#$suffix))
            (( number == expected )) || { echo "ERROR: Missing chunk ${expected}; found ${number} (${chunk})" >&2; exit 1; }
            size=$(stat -c '%s' "ACQUISITION/${chunk}")
            echo "chunk ${number}: ${chunk} = ${size} bytes"
            (( size > 0 )) || { echo "ERROR: Empty chunk: ${chunk}" >&2; exit 1; }
            expected=$((expected + 1))
          done

          first_size=$(stat -c '%s' "ACQUISITION/${chunks[0]}")
          last_size=$(stat -c '%s' "ACQUISITION/${chunks[-1]}")
          if (( ${#chunks[@]} > 1 )) && (( last_size == first_size )); then
            next=$((expected))
            echo "ERROR: Acquisition sequence appears incomplete: final chunk ${chunks[-1]} is exactly ${first_size} bytes, so chunk ${next} is likely missing." >&2
            exit 1
          fi

          printf '%s\n' "${chunks[@]}" > work/chunks.txt

      - name: Reconstruct split archive
        shell: bash
        run: |
          set -euo pipefail
          : > work/acquisition.zip
          while IFS= read -r chunk; do
            cat "ACQUISITION/${chunk}" >> work/acquisition.zip
          done < work/chunks.txt

          size=$(stat -c '%s' work/acquisition.zip)
          echo "Reconstructed archive size: ${size} bytes"
          (( size > 1000000 )) || { echo 'ERROR: Reconstructed archive is unexpectedly small.' >&2; exit 1; }

          echo '=== Archive identity ==='
          file work/acquisition.zip

      - name: Inspect and extract APK from acquisition archive
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import shutil
          import zipfile

          archive = Path('work/acquisition.zip')
          apk_out = Path('work/base.apk')

          print('=== Python ZIP inspection ===')
          try:
              with zipfile.ZipFile(archive, 'r') as z:
                  names = z.namelist()
                  print(f'Archive entries: {len(names)}')
                  for name in names:
                      info = z.getinfo(name)
                      print(f'  {name} ({info.file_size} bytes)')

                  bad = z.testzip()
                  if bad is not None:
                      raise RuntimeError(f'ZIP CRC/integrity failure in entry: {bad}')

                  apk_entries = [name for name in names if name.lower().endswith('.apk')]

                  if len(apk_entries) == 1:
                      entry = apk_entries[0]
                      print(f'Found nested APK: {entry}')
                      with z.open(entry, 'r') as src, apk_out.open('wb') as dst:
                          shutil.copyfileobj(src, dst)
                  elif len(apk_entries) == 0:
                      print('No nested APK found; treating reconstructed bytes as a raw split APK.')
                      shutil.copyfile(archive, apk_out)
                  else:
                      raise RuntimeError('Multiple APK files found: ' + ', '.join(apk_entries))
          except zipfile.BadZipFile as exc:
              raise SystemExit(f'ERROR: Reconstructed acquisition is not a valid ZIP archive: {exc}')

          size = apk_out.stat().st_size
          print(f'APK size: {size} bytes')
          if size <= 1_000_000:
              raise SystemExit('ERROR: Extracted APK is unexpectedly small.')

          print('=== APK ZIP validation ===')
          try:
              with zipfile.ZipFile(apk_out, 'r') as z:
                  bad = z.testzip()
                  if bad is not None:
                      raise SystemExit(f'ERROR: APK ZIP integrity failure in entry: {bad}')
                  names = set(z.namelist())
                  print(f'APK entries: {len(names)}')
                  required = {'AndroidManifest.xml', 'classes.dex'}
                  missing = sorted(required - names)
                  if missing:
                      raise SystemExit('ERROR: APK missing required top-level entries: ' + ', '.join(missing))
          except zipfile.BadZipFile as exc:
              raise SystemExit(f'ERROR: Extracted file is not a valid APK/ZIP: {exc}')
          PY

      - name: Validate Android APK identity
        shell: bash
        run: |
          set -euo pipefail
          sha256sum work/base.apk | tee output/base.apk.sha256
          cp work/base.apk "output/csr2-${TARGET_VERSION}.apk"

          python - <<'PY'
          import json, os
          from pathlib import Path
          chunks = Path('work/chunks.txt').read_text().splitlines()
          Path('output/acquisition-manifest.json').write_text(json.dumps({
              'target_version': os.environ['TARGET_VERSION'],
              'expected_package': os.environ['EXPECTED_PACKAGE'],
              'chunks': chunks,
              'source_type': 'split_zip_container',
              'reconstructed_filename': f"csr2-{os.environ['TARGET_VERSION']}.apk"
          }, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Upload APK acquisition artifact
        uses: actions/upload-artifact@v4
        with:
          name: csr2-${{ env.TARGET_VERSION }}-apk
          path: output/
          if-no-files-found: error
          retention-days: 30
