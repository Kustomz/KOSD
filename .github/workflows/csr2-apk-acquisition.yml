name: CSR2 APK Acquisition

on:
  push:
    branches:
      - main
    paths:
      - 'ACQUISITION/base*.zip.*'
  workflow_dispatch:
    inputs:
      target_version:
        description: 'CSR2 version being acquired (for example 6.6.0 or 6.7.0)'
        required: true
        default: '6.7.0'
      chunk_glob:
        description: 'Optional chunk glob relative to ACQUISITION; leave blank for automatic discovery'
        required: false
        default: ''
      expected_package:
        description: 'Expected Android package name'
        required: false
        default: 'com.naturalmotion.customstreetracer2'

permissions:
  contents: write

env:
  EXPECTED_PACKAGE: ${{ inputs.expected_package || 'com.naturalmotion.customstreetracer2' }}

concurrency:
  group: csr2-apk-acquisition-${{ inputs.target_version || github.sha }}
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out KOSD
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Determine acquisition version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.target_version || '' }}
          INPUT_GLOB: ${{ inputs.chunk_glob || '' }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$INPUT_VERSION"
            glob="$INPUT_GLOB"
          else
            mapfile -t changed < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" -- 'ACQUISITION/base*.zip.*')
            ((${#changed[@]} > 0)) || exit 0
            declare -A versions=()
            for path in "${changed[@]}"; do
              name="$(basename "$path")"
              if [[ "$name" =~ ^base\[([0-9]+)\]\.zip\.[0-9]{3}$ ]]; then
                versions["${BASH_REMATCH[1]}"]=1
              elif [[ "$name" =~ ^base\.zip\.[0-9]{3}$ ]]; then
                versions[legacy]=1
              fi
            done
            if ((${#versions[@]} != 1)); then
              echo "Push must contain exactly one APK acquisition version: ${!versions[*]}" >&2
              exit 1
            fi
            key="${!versions[@]}"
            if [[ "$key" == legacy ]]; then
              version='6.6.0'
              glob='base.zip.[0-9][0-9][0-9]'
            else
              version="$key"
              glob="base[${key}].zip.[0-9][0-9][0-9]"
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "glob=$glob" >> "$GITHUB_OUTPUT"

      - name: Discover and validate APK acquisition chunks
        if: ${{ steps.version.outputs.version != '' }}
        env:
          TARGET_VERSION: ${{ steps.version.outputs.version }}
          CHUNK_GLOB: ${{ steps.version.outputs.glob }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work output
          mapfile -t chunks < <(find ACQUISITION -maxdepth 1 -type f -name "$CHUNK_GLOB" -printf '%f\n' | sort -V)
          ((${#chunks[@]} > 0)) || { echo "ERROR: No APK acquisition chunks found for $TARGET_VERSION" >&2; exit 1; }
          expected=1
          for chunk in "${chunks[@]}"; do
            number=$((10#${chunk##*.}))
            ((number == expected)) || { echo "ERROR: Missing chunk $(printf '%03d' "$expected")" >&2; exit 1; }
            size=$(stat -c '%s' "ACQUISITION/$chunk")
            echo "chunk ${number}: ${chunk} = ${size} bytes"
            ((size > 0)) || { echo "ERROR: Empty chunk: $chunk" >&2; exit 1; }
            expected=$((expected + 1))
          done
          printf '%s\n' "${chunks[@]}" > work/chunks.txt

      - name: Reconstruct and validate APK
        if: ${{ steps.version.outputs.version != '' }}
        env:
          TARGET_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          : > work/acquisition.zip
          while IFS= read -r chunk; do cat "ACQUISITION/${chunk}" >> work/acquisition.zip; done < work/chunks.txt
          unzip -tq work/acquisition.zip
          python - <<'PY'
          from pathlib import Path
          import shutil, zipfile
          archive=Path('work/acquisition.zip'); apk=Path('work/base.apk')
          with zipfile.ZipFile(archive) as z:
              names=z.namelist(); bad=z.testzip()
              if bad: raise SystemExit(f'ZIP integrity failure: {bad}')
              entries=[n for n in names if n.lower().endswith('.apk')]
              if len(entries)==1:
                  with z.open(entries[0]) as src, apk.open('wb') as dst: shutil.copyfileobj(src,dst)
              elif not entries:
                  shutil.copyfile(archive,apk)
              else: raise SystemExit('Multiple APK files found')
          with zipfile.ZipFile(apk) as z:
              bad=z.testzip()
              if bad: raise SystemExit(f'APK integrity failure: {bad}')
              names=set(z.namelist())
              missing={'AndroidManifest.xml','classes.dex'}-names
              if missing: raise SystemExit('APK missing: '+', '.join(sorted(missing)))
          print(f'Validated APK: {apk.stat().st_size} bytes')
          sha256sum work/base.apk | tee "output/csr2-${TARGET_VERSION}.sha256"
          cp work/base.apk "output/csr2-${TARGET_VERSION}.apk"

      - name: Apply current-plus-previous retention
        if: ${{ steps.version.outputs.version != '' }}
        env:
          TARGET_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ACQUISITION/RELEASED_APK
          cp "output/csr2-${TARGET_VERSION}.apk" "ACQUISITION/RELEASED_APK/"
          cp "output/csr2-${TARGET_VERSION}.sha256" "ACQUISITION/RELEASED_APK/"
          mapfile -t versions < <(find ACQUISITION/RELEASED_APK -maxdepth 1 -type f -name 'csr2-*.apk' -printf '%f\n' | sed -E 's/^csr2-(.*)\.apk$/\1/' | sort -V)
          if ((${#versions[@]} > 2)); then
            for ((i=0; i<${#versions[@]}-2; i++)); do
              old="${versions[i]}"
              echo "Retention: removing APK version $old"
              rm -f "ACQUISITION/RELEASED_APK/csr2-${old}.apk" "ACQUISITION/RELEASED_APK/csr2-${old}.sha256"
            done
          fi
          find ACQUISITION/RELEASED_APK -maxdepth 1 -type f -printf '%f\n' | sort -V

      - name: Commit retained APK state
        if: ${{ success() && steps.version.outputs.version != '' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'KOSD APK Acquisition'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A ACQUISITION/RELEASED_APK
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Acquire CSR2 APK ${{ steps.version.outputs.version }}"
          git push origin HEAD:main

      - name: Upload APK acquisition artifact
        if: ${{ steps.version.outputs.version != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: csr2-${{ steps.version.outputs.version }}-apk
          path: output/
          if-no-files-found: error
          retention-days: 30
