name: CSR2 APK Acquisition

on:
  push:
    branches:
      - main
    paths:
      - 'ACQUISITION/*/base.apk'
  workflow_dispatch:
    inputs:
      target_version:
        description: 'CSR2 version being acquired (for example 6.6.0 or 6.7.0)'
        required: true
        default: '6.7.0'
      expected_package:
        description: 'Expected Android package name'
        required: false
        default: 'com.naturalmotion.customstreetracer2'

permissions:
  contents: write

env:
  EXPECTED_PACKAGE: ${{ inputs.expected_package || 'com.naturalmotion.customstreetracer2' }}

concurrency:
  group: csr2-apk-acquisition-${{ inputs.target_version || github.sha }}
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out KOSD
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Determine acquisition version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.target_version || '' }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$INPUT_VERSION"
          else
            mapfile -t changed < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" -- 'ACQUISITION/*/base.apk')
            ((${#changed[@]} > 0)) || exit 0
            declare -A versions=()
            for path in "${changed[@]}"; do
              if [[ "$path" =~ ^ACQUISITION/([^/]+)/base\.apk$ ]]; then
                versions["${BASH_REMATCH[1]}"]=1
              fi
            done
            if ((${#versions[@]} != 1)); then
              echo "Push must contain exactly one APK acquisition version: ${!versions[*]}" >&2
              exit 1
            fi
            version="${!versions[@]}"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "ERROR: Invalid CSR2 version: $version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate complete APK
        if: ${{ steps.version.outputs.version != '' }}
        env:
          TARGET_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          apk="ACQUISITION/${TARGET_VERSION}/base.apk"
          [[ -f "$apk" ]] || { echo "ERROR: Missing $apk" >&2; exit 1; }
          size=$(stat -c '%s' "$apk")
          echo "APK: $apk = $size bytes"
          ((size > 0)) || { echo "ERROR: APK is empty" >&2; exit 1; }
          if ((size >= 100000000)); then
            echo "ERROR: APK is at or above the regular Git 100 MiB limit; migrate APK acquisition to LFS before uploading it." >&2
            exit 1
          fi
          unzip -tq "$apk"
          python - <<PY
          from pathlib import Path
          import zipfile
          apk=Path('ACQUISITION/${TARGET_VERSION}/base.apk')
          with zipfile.ZipFile(apk) as z:
              bad=z.testzip()
              if bad: raise SystemExit(f'APK integrity failure: {bad}')
              names=set(z.namelist())
              missing={'AndroidManifest.xml','classes.dex'}-names
              if missing: raise SystemExit('APK missing: '+', '.join(sorted(missing)))
          print(f'Validated APK: {apk.stat().st_size} bytes')
          PY
          mkdir -p output
          sha256sum "$apk" | tee "output/csr2-${TARGET_VERSION}.sha256"
          cp "$apk" "output/csr2-${TARGET_VERSION}.apk"

      - name: Apply current-plus-previous retention
        if: ${{ steps.version.outputs.version != '' }}
        env:
          TARGET_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ACQUISITION/RELEASED_APK
          cp "output/csr2-${TARGET_VERSION}.apk" "ACQUISITION/RELEASED_APK/"
          cp "output/csr2-${TARGET_VERSION}.sha256" "ACQUISITION/RELEASED_APK/"
          mapfile -t versions < <(find ACQUISITION/RELEASED_APK -maxdepth 1 -type f -name 'csr2-*.apk' -printf '%f\n' | sed -E 's/^csr2-(.*)\.apk$/\1/' | sort -V)
          if ((${#versions[@]} > 2)); then
            for ((i=0; i<${#versions[@]}-2; i++)); do
              old="${versions[i]}"
              echo "Retention: removing APK version $old"
              rm -f "ACQUISITION/RELEASED_APK/csr2-${old}.apk" "ACQUISITION/RELEASED_APK/csr2-${old}.sha256"
            done
          fi
          find ACQUISITION/RELEASED_APK -maxdepth 1 -type f -printf '%f\n' | sort -V

      - name: Commit retained APK state
        if: ${{ success() && steps.version.outputs.version != '' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'KOSD APK Acquisition'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A ACQUISITION/RELEASED_APK
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Acquire CSR2 APK ${{ steps.version.outputs.version }}"
          git push origin HEAD:main

      - name: Upload APK acquisition artifact
        if: ${{ steps.version.outputs.version != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: csr2-${{ steps.version.outputs.version }}-apk
          path: output/
          if-no-files-found: error
          retention-days: 30
