name: KOSD OBB Ingestion

on:
  push:
    branches:
      - main
    paths:
      - 'ACQUISITION/*/com.naturalmotion.customstreetracer2/*.obb'
      - 'RESEARCH/CSR2/GAME_VERSIONS/**'
      - '.github/scripts/ingest_obb.sh'
      - '.github/workflows/kosd-obb-ingest.yml'
      - '.gitattributes'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kosd-obb-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          lfs: false
          fetch-depth: 0
          persist-credentials: true

      - name: Verify Git LFS and pull acquisition objects
        run: |
          set -euo pipefail
          git lfs version
          git lfs install --local
          git lfs pull

          echo "--- Direct OBB acquisition files ---"
          find ACQUISITION -type f -path '*/com.naturalmotion.customstreetracer2/*.obb' -print -exec ls -lh {} \;

      - name: Ingest, verify, promote, and apply retention
        run: bash .github/scripts/ingest_obb.sh

      - name: Show resulting changes
        run: |
          git status --short
          git diff --stat

      - name: Commit canonical OBB state
        if: ${{ success() && !cancelled() }}
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No repository changes produced by ingestion."
            exit 0
          fi

          git config user.name "KOSD OBB Ingestion"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Ingest canonical CSR2 OBB artifact"

      - name: Push Git LFS objects and repository commit
        if: ${{ success() && !cancelled() }}
        run: |
          set -euo pipefail
          git lfs push origin HEAD
          git push origin HEAD:main
