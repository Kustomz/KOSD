name: CSR2 UI Thumbnail Source Discovery

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'RESEARCH/CSR2/HV_EXTRACTION_6.7.0/discover_ui_thumbnail_sources.py'
      - '.github/workflows/csr2-ui-thumbnail-discovery.yml'

concurrency:
  group: csr2-ui-thumbnail-discovery
  cancel-in-progress: true

permissions:
  contents: read

env:
  MAIN_OBB: RESEARCH/CSR2/GAME_VERSIONS/6.7.0/MAIN_OBB/main.6705213.com.naturalmotion.customstreetracer2.obb
  PATCH_OBB: RESEARCH/CSR2/GAME_VERSIONS/6.7.0/PATCH_OBB/patch.6705213.com.naturalmotion.customstreetracer2.obb
  MAIN_SHA256: 33bf8465ea4b4d337f1514dc63c98e6f7059d893fdcd37133099ac83b4a92273
  PATCH_SHA256: 1f76f154ea4cedcab978f513942e515c60bc9f112aa4c8faccbfcf6b08582405

jobs:
  discover-ui-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          lfs: false
          fetch-depth: 1

      - name: Restore canonical CSR2 6.7.0 OBB cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.MAIN_OBB }}
            ${{ env.PATCH_OBB }}
          key: csr2-6.7.0-obbs-${{ env.MAIN_SHA256 }}-${{ env.PATCH_SHA256 }}

      - name: Acquire canonical CSR2 6.7.0 OBBs if cache is missing
        shell: bash
        run: |
          set -euo pipefail
          valid=1
          if [[ ! -f "$MAIN_OBB" || "$(sha256sum "$MAIN_OBB" | cut -d' ' -f1)" != "$MAIN_SHA256" ]]; then valid=0; fi
          if [[ ! -f "$PATCH_OBB" || "$(sha256sum "$PATCH_OBB" | cut -d' ' -f1)" != "$PATCH_SHA256" ]]; then valid=0; fi
          if [[ "$valid" -ne 1 ]]; then
            git lfs install --local
            git lfs pull --include="$MAIN_OBB,$PATCH_OBB"
          fi
          test "$(sha256sum "$MAIN_OBB" | cut -d' ' -f1)" = "$MAIN_SHA256"
          test "$(sha256sum "$PATCH_OBB" | cut -d' ' -f1)" = "$PATCH_SHA256"

      - name: Install UnityPy
        run: python3 -m pip install --upgrade pip && python3 -m pip install UnityPy

      - name: Discover UI thumbnail sources across both OBBs
        run: |
          set -euo pipefail
          python3 RESEARCH/CSR2/HV_EXTRACTION_6.7.0/discover_ui_thumbnail_sources.py

      - name: Upload broad UI thumbnail discovery
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: csr2-6.7.0-ui-thumbnail-source-discovery
          path: hv-output/ui-thumbnail-discovery/
          if-no-files-found: warn
          retention-days: 14
